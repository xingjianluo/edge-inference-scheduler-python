[project]
name = "edge-inference-scheduler-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = []

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
testpaths = ["tests"]
pythonpath = ["."]
